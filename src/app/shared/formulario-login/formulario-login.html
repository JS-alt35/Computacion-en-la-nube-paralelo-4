<div class="login">
  <h2>Iniciar Sesión</h2>

  <form>
    <label>Correo electrónico</label>
    <input
      type="email"
      [(ngModel)]="email"
      name="email"
      placeholder="correo@ejemplo.com"
      required
    >

    <label>Contraseña</label>
    <input
      type="password"
      [(ngModel)]="password"
      name="password"
      placeholder="********"
      required
    >

    <button (click)="iniciarSession()" type="button">
      Ingresar
    </button>
  </form>
</div>
